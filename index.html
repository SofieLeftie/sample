<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- The container for our grid -->
    <main class="grid-container">
        <figure>
            <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400" alt="A fluffy orange cat resting">
            <p>This beautiful orange cat is relaxing in the afternoon sun.</p>
        </figure>
        
        <figure>
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" alt="A cute tabby cat looking up curiously">
            <p>A curious tabby cat staring directly at the camera.</p>
        </figure>
        
        <figure>
            <img src="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?w=400" alt="A tiny grey kitten sleeping peacefully">
            <p>Nothing is cuter than a tiny grey kitten taking a nap.</p>
        </figure>
        
        <figure>
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=400" alt="A majestic black cat with striking yellow eyes">
            <p>The striking yellow eyes of this black cat are mesmerizing.</p>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=400" alt="A playful cat jumping in the air">
            <p>An energetic feline caught mid-jump while playing.</p>
        </figure>
    </main>

</body>
</html>
